name: Rename space.html to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename space.html to index.html
        run: |
          ls -la
          if [ -f space.html ] && [ ! -f index.html ]; then
            git config user.name "southlife-jp"
            git config user.email "southlife-jp@users.noreply.github.com"
            git mv space.html index.html
            git commit -m "Rename space.html to index.html"
            git push
          else
            echo "space.html missing or index.html already exists"
            ls -la
            exit 1
          fi
